[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "trust-evidence-protocol"
version = "0.1.0"
description = "Local fact protocol core for agent-owned sealed reasoning ledgers."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
  "cryptography>=42",
]

[project.optional-dependencies]
dev = []

[project.scripts]
tep-http = "tep.http_server:main"
tep-init = "tep.project_context:main"
tep-stdio = "tep.stdio_server:main"

[tool.setuptools.packages.find]
where = ["src"]
